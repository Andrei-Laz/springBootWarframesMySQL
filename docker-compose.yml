version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-warframe-server
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: wasd
      MYSQL_DATABASE: SpringBootWarframe
      MYSQL_USER: Andrei
      MYSQL_PASSWORD: wasd


#export database
#docker exec -i mysql-warframe-server mysqldump --no-tablespaces -u root -p SpringBootWarframe > SpringBootWarframe.sql

#import database
#docker exec -i mysql-warframe-server mysql -u root -p SpringBootWarframe < SpringBootWarframe.sql