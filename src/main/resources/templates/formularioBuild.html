<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${titulo}">Formulario Build</title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
    <h1 th:text="${titulo}">Formulario</h1>
    <form th:action="@{/builds/guardar}" method="post">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label class="form-label">Selecciona Warframe:</label>
                    <select name="warframeId" class="form-select" required>
                        <option value="">-- Selecciona un Warframe --</option>
                        <option th:each="warframe : ${warframes}"
                                th:value="${warframe.warframeId}"
                                th:text="${warframe.name}"></option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label class="form-label">Selecciona Mod:</label>
                    <select name="modId" class="form-select" required>
                        <option value="">-- Selecciona una Mod --</option>
                        <option th:each="modification : ${mods}"
                                th:value="${modification.modId}"
                                th:text="${modification.name}"></option>
                    </select>
                </div>
            </div>
        </div>
        <div class="mt-3">
            <button type="submit" class="btn btn-success">Guardar Build</button>
            <a th:href="@{/builds}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
