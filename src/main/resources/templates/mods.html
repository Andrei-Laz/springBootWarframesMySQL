<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Mods</title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
    <h1>Mods</h1>
    <h5 th:if="${mods.size() > 0}">Aquí tienes una tabla con todas las mods y las acciones que puedes hacer con ellas</h5>
    <p th:unless="${mods.size() > 0}">No hay mods registradas en el sistema</p>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Rareza</th>
            <th>Costo</th>
            <th>Polaridad</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="mod : ${mods}">
            <td th:text="${mod.modId}">1</td>
            <td th:text="${mod.name}">Vitality</td>
            <td th:text="${mod.rarity}">Common</td>
            <td th:text="${mod.cost}">4</td>
            <td th:text="${mod.polarity}">V</td>
            <td>
                <a th:href="@{/mod/{id}(id=${mod.modId})}" class="btn btn-primary btn-sm">Detalles</a>
                <a th:href="@{/mods/editar/{id}(id=${mod.modId})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/mods/borrar/{id}(id=${mod.modId})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Estás seguro de borrar esta mod?')">Borrar</a>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="mt-3">
        <a th:href="@{/mods/nuevo}" class="btn btn-success">Agregar Nueva Mod</a>
        <a th:href="@{/}" class="btn btn-secondary ms-2">Volver al Inicio</a>
    </div>
</div>
</body>
</html>
