<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Builds de <span th:text="${warframe?.name}"></span></title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
    <h1>Builds de <span th:text="${warframe?.name}"></span></h1>
    <h5 th:if="${builds.size() > 0}">Aquí tienes las mods asociadas a este warframe.</h5>
    <p th:unless="${builds.size() > 0}">Este warframe no tiene mods asociados.</p>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID Mod</th>
            <th>Nombre Mod</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="build : ${builds}">
            <td th:text="${build.id.idMod}">2</td>
            <td th:text="${build.modification?.name ?: 'N/A'}">Vitality</td>
            <td>
                <a th:href="@{/builds/borrar/{warframeId}/{modId}(warframeId=${build.id.idWarframe}, modId=${build.id.idMod})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Estás seguro de borrar esta build?')">Borrar</a>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="mt-3">
        <a th:href="@{/builds/nueva}" class="btn btn-success">Crear Nueva Build</a>
        <a th:href="@{/builds}" class="btn btn-secondary ms-2">Volver a Todas las Builds</a>
        <a th:href="@{/}" class="btn btn-outline-secondary ms-2">Inicio</a>
    </div>
</div>
</body>
</html>
