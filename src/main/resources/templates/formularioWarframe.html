<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${titulo}">Formulario Warframe</title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
    <h1 th:text="${titulo}">Formulario</h1>
    <form th:action="@{/warframes/guardar}" th:object="${warframe}" method="post">
        <!-- Campo oculto para el ID. Si es null se creará nuevo, si tiene valor se editará -->
        <input type="hidden" th:field="*{warframeId}" />
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label class="form-label">Nombre:</label>
                    <input type="text" class="form-control" th:field="*{name}" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Salud:</label>
                    <input type="number" class="form-control" th:field="*{health}" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Armadura:</label>
                    <input type="number" class="form-control" th:field="*{armor}" required />
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label class="form-label">Energía:</label>
                    <input type="number" class="form-control" th:field="*{energy}" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Velocidad de Sprint (x):</label>
                    <input type="number" step="0.1" class="form-control" th:field="*{sprintSpeed}" required />
                </div>
                <div class="mb-3">
                    <label class="form-label">Habilidad Pasiva:</label>
                    <textarea class="form-control" th:field="*{passive}" rows="3"></textarea>
                </div>
            </div>
        </div>
        <div class="mt-3">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/warframes}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
