<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalles del Warframe</title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card text-center">
                <div class="card-body">
                    <h1 class="card-title text-primary mb-4" th:text="${warframe.name}">Nombre</h1>

                    <!-- Datos del Warframe -->
                    <div class="row">
                        <div class="col-md-6">
                            <p class="fs-5">
                                <span class="fw-bold">ID:</span>
                                <span th:text="${warframe.warframeId}">1</span>
                            </p>
                            <p class="fs-5">
                                <span class="fw-bold">Salud:</span>
                                <span th:text="${warframe.health}">300</span>
                            </p>
                            <p class="fs-5">
                                <span class="fw-bold">Armadura:</span>
                                <span th:text="${warframe.armor}">150</span>
                            </p>
                        </div>
                        <div class="col-md-6">
                            <p class="fs-5">
                                <span class="fw-bold">Energía:</span>
                                <span th:text="${warframe.energy}">150</span>
                            </p>
                            <p class="fs-5">
                                <span class="fw-bold">Velocidad:</span>
                                <span th:text="${warframe.sprintSpeed} + 'x'">1.0x</span>
                            </p>
                            <p class="fs-5">
                                <span class="fw-bold">Pasiva:</span>
                                <span th:text="${warframe.passive}">Sin descripción</span>
                            </p>
                        </div>
                    </div>

                    <hr class="my-4">
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a th:href="@{/warframes/editar/{id}(id=${warframe.warframeId})}"
                           class="btn btn-warning me-md-2">Editar</a>
                        <a th:href="@{/warframes/borrar/{id}(id=${warframe.warframeId})}"
                           class="btn btn-danger me-md-2"
                           onclick="return confirm('¿Estás seguro de borrar este warframe?')">Borrar</a>
                    </div>
                </div>
            </div>
            <p class="mt-3"><a th:href="@{/warframes}">Volver al listado</a></p>
        </div>
    </div>
</div>
</body>
</html>
